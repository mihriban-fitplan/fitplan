<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMS Egzersiz Planı</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16161e">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; font-family: 'Inter', sans-serif; color: #f0f0f0; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }

.top-nav { background: #0a0a10; padding: 14px 16px 0; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid #1e1e2a; }
.app-label { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #444; text-transform: uppercase; margin-bottom: 10px; }
.day-tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 4px; }
.day-tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 10px 14px 12px; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: 'Inter', sans-serif; }
.tab.d0.active { color: #fff; border-bottom-color: #5af3c8; }
.tab.d1.active { color: #fff; border-bottom-color: #e07090; }
.tab.d2.active { color: #fff; border-bottom-color: #c8d44a; }

.page { display: none; }
.page.active { display: block; }

.day-header { padding: 18px 16px 14px; border-bottom: 1px solid #1e1e2a; }
.day-tag { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.day-name { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
.day-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.meta-chip { background: #1a1a26; border-radius: 20px; padding: 4px 11px; font-size: 11px; font-weight: 600; color: #888; }
